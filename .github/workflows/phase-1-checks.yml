name: Phase 1 checks

concurrency:
  group: phase-1-checks-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: ["phase-1/evidence-foundation"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: "file:./dev.db"
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./dev.db"
      - run: npm test
      - run: npm run lint
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
          BETTER_AUTH_SECRET: "ci-only-secret-with-at-least-32-characters"
          BETTER_AUTH_URL: "https://majalis-ci.example.invalid"
          SMTP_HOST: "smtp.example.invalid"
          SMTP_PORT: "587"
          SMTP_USER: "ci-user"
          SMTP_PASS: "ci-password-not-used"
          MAIL_FROM: "Majalis CI <ci@example.invalid>"
      - name: Audit dependency vulnerabilities
        if: always()
        run: npm audit --audit-level=high
