name: Extract first genealogy source

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/extract-sabaik-source.yml"
      - "scripts/extract_genealogy_source.py"

permissions:
  contents: read

concurrency:
  group: sabaik-source-extraction
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install PDF text and Arabic OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-ara
          TESSDATA_DIR="$(tesseract --print-tessdata-dir)"
          # Prefer the higher-accuracy model, but keep the distro model if the
          # upstream model host is temporarily unavailable.
          curl --fail --location --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/ara.traineddata \
            --output "$TESSDATA_DIR/ara.traineddata" || echo "::warning::Could not fetch tessdata_best; using packaged Arabic model."
      - name: Download the public-domain scan
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://upload.wikimedia.org/wikisource/ar/5/58/%D8%B3%D8%A8%D8%A7%D8%A6%D9%83_%D8%A7%D9%84%D8%B0%D9%87%D8%A8_%D9%81%D9%8A_%D9%85%D8%B9%D8%B1%D9%81%D8%A9_%D9%82%D8%A8%D8%A7%D8%A6%D9%84_%D8%A7%D9%84%D8%B9%D8%B1%D8%A8.pdf' \
            --output /tmp/sabaik-al-dhahab.pdf
          pdfinfo /tmp/sabaik-al-dhahab.pdf | tee /tmp/source-pdf-info.txt
          sha256sum /tmp/sabaik-al-dhahab.pdf | tee /tmp/source-pdf-sha256.txt
      - name: Extract page-linked candidates and passages
        run: |
          python scripts/extract_genealogy_source.py /tmp/sabaik-al-dhahab.pdf
          cat /tmp/source-pdf-info.txt /tmp/source-pdf-sha256.txt > data/sources/sabaik-al-dhahab/source-report.txt
          {
            echo "## First-source extraction"
            echo
            echo 'All rows are candidates/passages, not verified genealogy.'
            echo
            echo '### Counts'
            echo 'Pages processed and candidate counts are recorded in the job log.'
            echo
            echo '### Review gate'
            echo 'Every row is UNREVIEWED. Do not import names or lineage claims without checking the cited page image.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload extraction report for human review
        uses: actions/upload-artifact@v4
        with:
          name: sabaik-al-dhahab-extraction
          path: data/sources/sabaik-al-dhahab/
          if-no-files-found: error
          retention-days: 30
