services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-majalis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-majalis_secret}
      POSTGRES_DB: ${DB_NAME:-majalis_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-majalis} -d ${DB_NAME:-majalis_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432"

  web:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-majalis}:${DB_PASSWORD:-majalis_secret}@db:5432/${DB_NAME:-majalis_db}?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-dev_secret_change_me_in_production_at_least_32_chars}
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-preview.example}
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    command: sh -c "apk add --no-cache openssl && npm install && npx prisma generate && npm run dev"

  db-migrate:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-majalis}:${DB_PASSWORD:-majalis_secret}@db:5432/${DB_NAME:-majalis_db}?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "apk add --no-cache openssl && npm install && npx prisma generate && npx prisma db push --accept-data-loss"
    restart: "no"

volumes:
  db_data:
